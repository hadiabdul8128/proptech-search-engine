services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env.local
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next

volumes:
  node_modules:
  next_cache:
