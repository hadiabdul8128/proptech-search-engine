services:
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
    depends_on:
      - redis
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env.local
    environment:
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    command: npm run worker:dev
    depends_on:
      - redis
    env_file:
      - .env.local
    environment:
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      WORKER_HEALTH_PORT: 8081
    ports:
      - "${WORKER_HEALTH_PORT:-8081}:8081"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
  next_cache:
  redis-data:
